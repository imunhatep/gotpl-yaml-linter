name: Publish release artifacts

on:
  release:
    types: [created]
permissions:
  contents: write
  pull-requests: write

jobs:
  update_readme:
    name: Update Readme
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Update versions in readme
        run: |
          sed -r -i "s/gotpl-linter:v[0-9]+\.[0-9]+\.[0-9]+/gotpl-linter:${{ github.ref_name }}/" README.md
          sed -r -i "s/gotpl-linter-v[0-9]+\.[0-9]+\.[0-9]+/gotpl-linter-${{ github.ref_name }}/" README.md
          sed -r -i "s/\/v[0-9]+\.[0-9]+\.[0-9]+\//\/${{ github.ref_name }}\//" README.md
      - uses: peter-evans/create-pull-request@v5
        name: Create Pull Request
        with:
          title: Update readme for ${{ github.ref_name }} release
          commit-message: Update readme for ${{ github.ref_name }} release
          body: Updating version references in the readme to ${{ github.ref_name }}
          branch: update-readme-${{ github.ref_name }}
          delete-branch: true

  release:
    name: Publish binaries
    runs-on: ubuntu-22.04
    steps:
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Project binaries
        env:
          CGO_ENABLED: 0
        run: |
          make xc
      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/gotpl*
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true

  image:
    name: Publish image
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
